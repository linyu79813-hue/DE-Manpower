<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>外送人力盤點</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#25282d;font:16px system-ui,sans-serif}header{background:#b71932;color:white;padding:22px}main{max-width:1100px;margin:auto;padding:16px}section{background:white;border:1px solid #ddd;border-radius:12px;padding:20px;margin:16px 0}h2{font-size:20px}label{display:block;margin:12px 0}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #ccc;border-radius:6px}input[type=checkbox],input[type=radio]{width:auto}button{cursor:pointer;background:#b71932;color:white;border:0;margin:4px}button.secondary{background:#555}nav button{background:white;color:#b71932}textarea{width:100%}.day{border-bottom:1px solid #eee;padding:12px 0}.slot{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.metric{background:#f5f5f5;padding:16px;border-radius:8px}.metric strong{display:block;font-size:28px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left;white-space:nowrap}th{background:#eee}.scroll{overflow:auto}.bar{height:12px;background:#b71932;border-radius:4px}small{color:#666} .hidden{display:none}</style><header><h1>外送員人力盤點</h1><nav><button onclick="show('survey')">員工問卷</button><button onclick="manage('center')">中心管理</button><button onclick="manage('op')">OP Dashboard</button></nav></header><main><p id="mode"></p><div id="survey"><form id="form"><section><h2>01 基本資料</h2><p>填寫實際可配合時間，僅供排班參考，不代表工時承諾。</p><label>中心 <select id="center" required></select></label><label>Group <select id="group" required></select></label><label>員工編號 <input id="emp" required></label><label>姓名 <input id="name" required></label></section><section><h2>02 每週可排班區間</h2><small>每天請新增時段或明確勾選不可排班。可複製星期一設定。</small><button type="button" class="secondary" onclick="copyMonday()">複製星期一至其他日</button><div id="days"></div></section><section><h2>03 排班彈性</h2><p>是否可以接受單次2.5～3小時短班？</p><div id="short"></div><p>若希望單日安排較長工作時數，是否可以接受兩段班？</p><small>例如 11:00–14:00、17:00–21:00</small><div id="split"></div></section><section><h2>04 餐廳支援意願</h2><p>是否願意於非餐期至餐廳支援工作？</p><div id="willing"></div><div id="reasonbox" hidden><h3 id="reasonTitle"></h3><div id="reasons"></div><label>其他原因或想法（自由填寫）<textarea id="other" rows="3"></textarea></label></div></section><button type="submit">提交問卷</button><p id="status" role="status"></p></form></div><div id="admin" hidden><section id="login" hidden><h2>管理者登入</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="密碼"><button onclick="signIn()">登入</button><p id="loginmsg"></p></section><div id="report" hidden><section><h2 id="reportTitle"></h2><label>中心 <select id="filter"></select> Group <select id="fg"></select></label><button onclick="load()">重新整理</button><button onclick="exportExcel()">匯出 Excel</button><button id="demo" onclick="demo()">載入虛構示範資料</button><button onclick="logout()">登出</button><p id="reportmsg"></p><div class="cards" id="metrics"></div></section><section><h2>每半小時可排班人數</h2><label>星期 <select id="weekday"></select></label><div id="heat"></div><small>午餐期 11:30–13:00；晚餐期 17:00–19:30。統計完整覆蓋半小時的人數，非實際排班。</small></section><section><h2>餐廳支援原因</h2><div id="reasonstats"></div></section><section><h2>六中心比較</h2><div class="scroll" id="compare"></div></section><section><h2>每週給班清冊</h2><div class="scroll" id="detail"></div></section></div></div></main><script>
const $=id=>document.getElementById(id), centers=['台北','新北','桃園','台中','台南','高雄'], groups='ABCDEFGHI'.split(''), days=['星期一','星期二','星期三','星期四','星期五','星期六','星期日'], opts=(a)=>a.map(x=>`<option>${x}</option>`).join(''), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), reasons={yes:['可以增加工作機會及收入','願意學習不同的工作內容','可以接受餐廳工作環境','願意配合公司營運需求','喜歡餐廳團隊合作'],no:['只希望從事外送工作','不熟悉餐廳工作內容','餐廳工作壓力較大','不適應餐廳工作環境','與餐廳管理組的溝通問題','與餐廳員工的相處問題','薪資與工作內容不符期待','支援餐廳距離太遠','無法配合餐廳支援時段']};
const db=window.CONFIG?.url&&window.CONFIG?.key?supabase.createClient(CONFIG.url,CONFIG.key):null; $('mode').textContent=db?'正式資料庫模式':'示範模式：資料僅存在此瀏覽器，請勿輸入真實員工資料。'; $('center').innerHTML='<option value="">請選擇</option>'+opts(centers);$('group').innerHTML='<option value="">請選擇</option>'+opts(groups);$('filter').innerHTML=opts(['全部',...centers]);$('fg').innerHTML=opts(['全部',...groups]);$('weekday').innerHTML=opts(days);const times=Array.from({length:49},(_,i)=>`${String(i>>1).padStart(2,'0')}:${i%2?'30':'00'}`);const radio=(id,a,b)=>$(id).innerHTML=`<label><input required type="radio" name="${id}" value="yes"> ${a}</label><label><input required type="radio" name="${id}" value="no"> ${b}</label>`;radio('short','可以接受','無法接受');radio('split','可以接受','無法接受');radio('willing','願意','不願意');const val=n=>document.querySelector(`input[name=${n}]:checked`)?.value; $('willing').onchange=()=>{$('reasonbox').hidden=false;$('reasonTitle').textContent=val('willing')==='yes'?'願意支援的原因（可複選）':'不願意支援的原因（可複選）';$('reasons').innerHTML=reasons[val('willing')].map(r=>`<label><input type="checkbox" name="reason" value="${r}"> ${r}</label>`).join('');$('other').value=''};
$('days').innerHTML=days.map((d,i)=>`<div class="day"><b>${d}</b><label><input type="checkbox" id="off${i}" onchange="toggle(${i})"> 不可排班</label><div id="slots${i}"></div><button type="button" id="add${i}" onclick="add(${i})">＋新增區間</button></div>`).join('');function add(i,a='11:00',b='14:00'){let div=document.createElement('div');div.className='slot';div.innerHTML=`<select aria-label="開始時間">${opts(times.slice(0,-1))}</select> 至 <select aria-label="結束時間">${opts(times.slice(1))}</select><button type="button" class="secondary" onclick="this.parentElement.remove()">刪除</button>`;div.children[0].value=a;div.children[1].value=b;$('slots'+i).append(div)}function toggle(i){$('slots'+i).hidden=$('off'+i).checked;$('add'+i).hidden=$('off'+i).checked}function getDay(i){return $('off'+i).checked?[]:[...$('slots'+i).children].map(d=>[d.children[0].value,d.children[1].value])}function copyMonday(){for(let i=1;i<7;i++){$('off'+i).checked=$('off0').checked;$('slots'+i).innerHTML='';getDay(0).forEach(s=>add(i,...s));toggle(i)}}const mins=t=>Number(t.slice(0,2))*60+Number(t.slice(3));const hours=s=>s.reduce((n,[a,b])=>n+(mins(b)-mins(a))/60,0);const local=()=>JSON.parse(localStorage.getItem('manpower-demo')||'[]');let rows=[],view='op';$('form').onsubmit=async e=>{e.preventDefault();try{let schedule=days.map((d,i)=>{let s=getDay(i).sort((a,b)=>a[0].localeCompare(b[0]));if(!s.length&&!$('off'+i).checked)throw Error(d+'請填寫區間或勾選不可排班');if(s.some(([a,b],j)=>a>=b||(j&&a<s[j-1][1])))throw Error(d+'時間錯誤或重疊');return s});let rs=[...document.querySelectorAll('input[name=reason]:checked')].map(x=>x.value);if(!rs.length&&!$('other').value.trim())throw Error('請選擇或填寫支援原因');let r={center:$('center').value,group_name:$('group').value,employee_id:$('emp').value.trim(),employee_name:$('name').value.trim(),schedule,short_shift:val('short'),split_shift:val('split'),willing:val('willing'),reasons:rs,other:$('other').value.trim(),submitted_at:new Date().toISOString()};if(!r.employee_id||!r.employee_name)throw Error('請填寫員工資料');if(db){let {error}=await db.from('responses').insert(r);if(error)throw error}else{localStorage.setItem('manpower-demo',JSON.stringify([...local(),r]))}$('status').textContent='已提交。';}catch(e){$('status').textContent=e.message}};
function show(p){$('survey').hidden=p!=='survey';$('admin').hidden=p==='survey'}async function manage(v){view=v;show('admin');$('reportTitle').textContent=v==='op'?'OP Dashboard':'中心管理';if(db){let {data}=await db.auth.getSession();$('login').hidden=!!data.session;$('report').hidden=!data.session;$('demo').hidden=true;if(data.session)load()}else{$('login').hidden=true;$('report').hidden=false;load()}}async function signIn(){let {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)$('loginmsg').textContent=error.message;else manage(view)}async function logout(){if(db)await db.auth.signOut();show('survey')}async function load(){try{let data;if(db){data=[];for(let start=0;;start+=1000){let r=await db.from('responses').select('*').order('id').range(start,start+999);if(r.error)throw r.error;data.push(...r.data);if(r.data.length<1000)break}}else data=local();let m=new Map();data.sort((a,b)=>a.submitted_at.localeCompare(b.submitted_at)).forEach(r=>m.set(r.center+'|'+r.employee_id,r));rows=[...m.values()];$('reportmsg').textContent='每中心／員工編號取最新提交；未匯入在職名單及實際班表。';render()}catch(e){$('reportmsg').textContent=e.message;rows=[];render()}}const filtered=()=>rows.filter(r=>($('filter').value==='全部'||r.center===$('filter').value)&&($('fg').value==='全部'||r.group_name===$('fg').value));const yes=(r,k)=>r[k]==='yes'?'是':'否';const pct=(n,d)=>d?(100*n/d).toFixed(1)+'%':'—';const count=(r,k)=>r.filter(x=>x[k]==='yes').length;const slotCount=(r,d,t)=>r.filter(x=>x.schedule[d].some(([a,b])=>mins(a)<=t&&mins(b)>=t+30)).length;const table=(head,data)=>'<table><thead><tr>'+head.map(x=>`<th>${esc(x)}</th>`).join('')+'</tr></thead><tbody>'+data.map(r=>'<tr>'+r.map(x=>`<td>${esc(x)}</td>`).join('')+'</tr>').join('')+'</tbody></table>';const headers=['中心','Group','員工編號','姓名',...days,'可給班區間合計(H)','短班','兩段班','餐廳支援'];const detail=r=>[r.center,r.group_name,r.employee_id,r.employee_name,...r.schedule.map(s=>s.map(x=>x.join('–')).join('、')||'不可排班'),r.schedule.reduce((n,s)=>n+hours(s),0),yes(r,'short_shift'),yes(r,'split_shift'),r.willing==='yes'?'願意':'不願意'];function render(){let r=filtered(),n=r.length;$('metrics').innerHTML=[['有效回覆',n],['接受短班',count(r,'short_shift')+' 人 / '+pct(count(r,'short_shift'),n)],['接受兩段班',count(r,'split_shift')+' 人 / '+pct(count(r,'split_shift'),n)],['願意支援',count(r,'willing')+' 人 / '+pct(count(r,'willing'),n)],['不願意支援',n-count(r,'willing')]].map(([k,v])=>`<div class="metric">${k}<strong>${v}</strong></div>`).join('');let d=days.indexOf($('weekday').value);$('heat').innerHTML=times.slice(0,-1).map((t,i)=>{let c=slotCount(r,d,i*30);return `<div style="display:grid;grid-template-columns:65px 1fr 45px;gap:8px;align-items:center;margin:4px"><small>${t}</small><div class="bar" style="width:${n?100*c/n:0}%"></div>${c}</div>`}).join('');$('reasonstats').innerHTML=['yes','no'].map(w=>`<h3>${w==='yes'?'願意':'不願意'}</h3>`+table(['原因','人數','占該意願比例'],reasons[w].map(s=>{let a=r.filter(x=>x.willing===w);let c=a.filter(x=>x.reasons.includes(s)).length;return [s,c,pct(c,a.length)]}))).join('');$('compare').innerHTML=table(['中心','回覆','短班接受率','兩段班接受率','支援意願率'],centers.map(c=>{let a=r.filter(x=>x.center===c);return[c,a.length,...['short_shift','split_shift','willing'].map(k=>pct(count(a,k),a.length))]}));$('detail').innerHTML=table(headers,r.map(detail))}['filter','fg','weekday'].forEach(id=>$(id).onchange=render);function exportExcel(){if(!window.XLSX){alert('Excel 元件未載入');return}let r=filtered(),wb=XLSX.utils.book_new();function sheet(name,head,data){let ws=XLSX.utils.aoa_to_sheet([head,...data]);ws['!cols']=head.map((h,i)=>({wch:Math.min(65,Math.max(12,h.length*2,...data.map(row=>String(row[i]??'').length*1.3)))}));ws['!autofilter']={ref:ws['!ref']};XLSX.utils.book_append_sheet(wb,ws,name)}sheet('每週給班清冊',headers,r.map(detail));sheet('每日可給班工時',['中心','Group','員工編號','姓名',...days,'合計'],r.map(x=>[x.center,x.group_name,x.employee_id,x.employee_name,...x.schedule.map(hours),x.schedule.reduce((n,s)=>n+hours(s),0)]));sheet('半小時人力',['中心','Group','星期','開始','結束','人數'],[...new Set(r.map(x=>x.center+'|'+x.group_name))].flatMap(k=>{let [c,g]=k.split('|'),a=r.filter(x=>x.center===c&&x.group_name===g);return days.flatMap((d,j)=>times.slice(0,-1).map((t,i)=>[c,g,d,t,times[i+1],slotCount(a,j,i*30)]))}));sheet('餐廳支援',['中心','Group','員工編號','姓名','意願','原因','其他'],r.map(x=>[x.center,x.group_name,x.employee_id,x.employee_name,x.willing==='yes'?'願意':'不願意',x.reasons.join('、'),x.other]));XLSX.writeFile(wb,'外送員每週可排班清冊.xlsx')}function demo(){if(db)return;let a=Array.from({length:18},(_,i)=>({center:centers[i%6],group_name:groups[i%3],employee_id:'DEMO'+i,employee_name:'示範員工'+(i+1),schedule:days.map((_,j)=>j===i%7?[]:i%2?[['11:00','14:00'],['17:00','21:00']]:[['17:00','21:00']]),short_shift:i%3?'yes':'no',split_shift:i%2?'yes':'no',willing:i%3?'yes':'no',reasons:[reasons[i%3?'yes':'no'][0]],other:'',submitted_at:new Date().toISOString()}));localStorage.setItem('manpower-demo',JSON.stringify([...local().filter(x=>!x.employee_id.startsWith('DEMO')),...a]));load()}
</script></html>
